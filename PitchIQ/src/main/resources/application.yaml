spring:
  application:
    name: PitchIQ

  datasource:
    url: jdbc:mysql://localhost:3307/pitch_iq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: false
      database-platform: org.hibernate.dialect.MySQLDialect
      properties:
        hibernate:
          format_sql: true
          '[jdbc.batch_size]': 20

    flyway:
      enabled: true
      locations: classpath:db/migration
      baseline-on-migrate: true
      validate-on-migrate: true

  server:
    port: 8080
    servlet:
      context-path: /
    error:
      include-message: never
      include-binding-errors: never

  app:
    jwt:
      secret: ${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_must_be_at_least_32_chars_for_HS256}
      expiration-minutes: 60
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

  logging:
    level:
      it.pitchiq: INFO
      org.springframework.security: WARN
      org.flywaydb: INFO