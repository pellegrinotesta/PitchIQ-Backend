# Profilo DEMO: database separato (pitch_iq_demo, creato se manca) con dati completamente inventati.
# Avvio: SPRING_PROFILES_ACTIVE=demo java -jar PitchIQ/target/PitchIQ-0.0.1-SNAPSHOT.jar
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/pitch_iq_demo?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

  flyway:
    locations: classpath:db/migration,classpath:db/demo-data
