spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    show-sql: false

  flyway:
    # In prod solo le migration versionate, mai i seed
    locations: classpath:db/migration

server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

logging:
  level:
    it.pitchiq: WARN
    org.springframework.security: WARN
    org.flywaydb: WARN
    root: ERROR